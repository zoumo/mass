# Use a separate, empty directory for a fresh rollout.
# Reuse the instance's schema 28 directory on restart.
dataDir: ./superagent-core-data
# Optional: defaults to 127.0.0.1:24370. Wider bindings require trusted readers.
listen: 127.0.0.1:24370
# Optional Core URL for Session clients, including through a reverse proxy.
# externalURL: https://core.example.com
# Optional additional HTTP Host values for direct Core resource reads.
# Include the port when clients send it. The same-origin gateway sets the upstream Host.
# readAllowedHosts:
#   - core.example.com:24370
sources:
  - source: dws
    accountId: example-account
    # instanceId: collector-1  # match the Trigger for channel replies
    # outboxConsumer: true  # select one sender when the account has multiple instances
    tokenFile: ./source.token
    threadIdPrefixes: ["dws:"]
# Optional SQLite main-database page budget; zero means unlimited.
storageMaxPages: 0

# Optional OpenObserve queries for Core trace and process metric reads.
# The private credential file contains a username and password on separate lines.
# openobserve:
#   endpoint: http://127.0.0.1:15080
#   organization: default
#   stream: default
#   credentialFile: ./openobserve-login.txt

# Optional: add sessions to let Core start Sessions through massd.
# Choose the Router workspace, fixed role profiles and available Issue profiles.
# New Sessions use fullAccess and disable native agent questions.
# massd:
#   endpoint: ws://127.0.0.1:24368/jsonrpc
#   tokenFile: ./massd.token  # set when massd uses an instance token
# For `serve` with embedded MASS, replace the endpoint and tokenFile with:
#   embedded:
#     dataDir: ./massd
#     expose:  # optional, requires a loopback Core listener
#       tokenFile: ./embedded-massd.token  # private file and dedicated token
#       allowedOrigins: [https://ops.example.com]  # optional, if clients send Origin
# operatorTokenFile: ./operator.token  # optional, for loopback ScheduledTask management and input recovery
