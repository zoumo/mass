dwsExecutable: /absolute/path/to/dws
profile: CORP_ID:ACCOUNT_ID
source: dws
accountId: ACCOUNT_ID
selfOpenDingtalkId: ACCOUNT_OPEN_DINGTALK_ID
instanceId: dws-adapter-1
coreEndpoint: http://127.0.0.1:24370
coreTokenEnv: SUPERAGENT_DWS_TOKEN
statusListen: 127.0.0.1:24371
databasePath: /absolute/path/to/dws.sqlite
direct:
  enabled: true
  match:
    - prefix: "助理 "
selfChat:
  enabled: false
  conversationId: NATIVE_SELF_CONVERSATION_ID
  match:
    - prefix: "记录 "
