# Defaults to this directory beside the YAML file. Use an empty directory for schema 24.
dataDir: ./superagent-core-data
# Optional: defaults to 127.0.0.1:24370. Wider bindings require trusted readers.
listen: 127.0.0.1:24370
sources:
  - source: dws
    accountId: example-account
    # instanceId: collector-1  # match the Trigger for channel replies
    # outboxConsumer: true  # select one sender when the account has multiple instances
    tokenFile: ./source.token
# Optional SQLite main-database page budget; zero means unlimited.
storageMaxPages: 0

# Optional OpenObserve trace and process metric queries from the Observer.
# The private credential file contains a username and password on separate lines.
# observerTrace:
#   endpoint: http://127.0.0.1:5080
#   organization: default
#   stream: default
#   credentialFile: ./openobserve-login.txt

# Optional: enabling execution allows Core to start Sessions through massd.
# Choose the Router workspace, fixed role profiles and available Issue profiles.
# New Sessions use fullAccess and disable native agent questions.
