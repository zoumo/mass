accountId: github-local
instanceId: github-trigger-1
coreEndpoint: http://127.0.0.1:24370
coreTokenEnv: GITHUB_CORE_TOKEN
githubTokenEnv: GITHUB_TOKEN
statusListen: 127.0.0.1:24372
databasePath: /absolute/path/to/github.sqlite
pollIntervalSeconds: 60
# Optional. Omit repositories or set it to [] to accept notifications from
# every repository accessible to the GitHub account.
repositories:
  - repository: example-org/example-sdk
    prompt: |
      Report changes that affect callers of the SDK.
  - repository: example-org/example-app
    prompt: |
      Report changes that affect the application workflow.
