# Defaults to this directory beside the YAML file. Use an empty directory for schema 19.
dataDir: ./superagent-core-data
# Optional: defaults to 127.0.0.1:24370. Wider bindings require trusted readers.
listen: 127.0.0.1:24370
sources:
  - source: dws
    accountId: example-account
    # instanceId: collector-1  # match the Trigger for channel replies
    # outboxConsumer: true  # select one sender when the account has multiple instances
    tokenFile: ./source.token
# Optional SQLite main-database page budget; zero means unlimited.
storageMaxPages: 0

# Optional: enabling execution allows Core to start Sessions through massd.
# Use an existing Runtime and choose the Router workspace explicitly.
# execution:
#   massdEndpoint: ws://127.0.0.1:24368/rpc
#   runtimeRef: agent
#   routerWorkspace: /absolute/workspace
#   namespace: superagent
#   tokenFile: ./massd.token  # omit only for explicit local massd access
#   operatorTokenFile: ./operator.token  # optional, for loopback CLI input recovery
#   mcpCommand: /absolute/bin/superagent  # defaults to the current executable
