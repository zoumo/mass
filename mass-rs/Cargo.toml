[package]
name = "mass-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "HTTP service for native Codex agent sessions"
publish = false

[[bin]]
name = "massd"
path = "src/main.rs"

[workspace]
members = [".", "domain", "runtime", "journal", "events", "codex", "sessions", "http", "vendor/codex-app-server-client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
codex-app-server-client = { git = "https://github.com/openai/codex", rev = "d27764b82f7118f674371e6d6e76271d9d606edb" }
codex-app-server-protocol = { git = "https://github.com/openai/codex", rev = "d27764b82f7118f674371e6d6e76271d9d606edb" }
nix = { version="0.30", features=["signal"] }
# The official SDK transitively uses xz2; avoid machine-specific dylib install names.
lzma-sys = { version="=0.1.20", features=["static"] }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = "0.3"
time = { version = "0.3", features = ["formatting"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7"] }

sha2 = "0.10"
base64 = "0.22"
toml = "0.9"

mass-domain = { path = "domain" }
mass-runtime = { path = "runtime" }
mass-journal = { path = "journal" }
mass-events = { path = "events" }
mass-codex = { path = "codex" }
mass-sessions = { path = "sessions" }
mass-http = { path = "http" }

[dependencies]
mass-runtime.workspace = true
mass-codex.workspace = true
serde.workspace = true
mass-sessions.workspace = true
mass-http.workspace = true
mass-events.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio-tungstenite = "0.28.0"
sha2.workspace = true
uuid.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream"] }
mass-journal.workspace = true
mass-runtime.workspace = true
tempfile.workspace = true
futures-util.workspace = true

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "efa177859fd9623d57b9fe7ae9bf491ae1ac6ec4" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[profile.dev]
debug = 0
incremental = false

# Keep Handler panic isolation; single-file delivery must retain unwinding.
[profile.release]
opt-level = 2
debug = 0
strip = "debuginfo"
panic = "unwind"
incremental = false

[patch."https://github.com/openai/codex"]
codex-app-server-client = { path = "vendor/codex-app-server-client" }
