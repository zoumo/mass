stateFile: ./mass-sa-demo/state.json

mass:
  endpoint: ws://127.0.0.1:24368/rpc
  namespace: sa-system
  tokenEnv: MASS_TOKEN

management:
  listen: 127.0.0.1:8787
  tokenEnv: MASS_SA_MANAGEMENT_TOKEN

projects:
  - id: mass
    name: MASS
    cwd: /absolute/path/to/project
    runtimeRef: example-claude-runtime
    memory: |
      MASS keeps the WebSocket JSON-RPC contract authoritative.
      Read the repository and harness rules before changing code.
      Keep changes minimal and preserve unrelated user work.
    router:
      model: example-model
      effort: low
    worker:
      # Additional Runtime names allowed by create_worker.runtimeRef.
      runtimeRefs: []
      model: example-model
      effort: high
    inbox:
      mergeWindowMs: 1000
      maxBatchSize: 8
      maxPromptBytes: 98304
