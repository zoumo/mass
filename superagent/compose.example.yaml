# Replace the example account, profile, repository, and executable path.
# Supply private Core token files and inject the matching environment variables.
core:
  dataDir: ./superagent-core-data
  # Use an IP address or hostname with a port. Use :24370 for a wildcard.
  listen: 127.0.0.1:24370
  # Optional MASS settings. The default data directory is ./massd-data.
  # massd:
  #   embedded:
  #     dataDir: ./massd-data
  #     expose:
  #       tokenFile: ./secrets/massd.token
  # Optional. Set the OpenObserve HTTP or HTTPS base URL with any proxy path prefix.
  # openobserve:
  #   endpoint: http://127.0.0.1:15080
  #   organization: default
  #   stream: default
  #   credentialFile: ./secrets/openobserve-login.txt
  # Add sessions from config.example.yaml to enable Core Agent execution.
  # Optional remote computer for Topic and Issue Sessions.
  # remoteComputer:
  #   cua:
  #     command: /opt/mass/bin/cua-mcp
  #     configFile: ./cua-mcp.yaml
  sources:
    - source: github
      accountId: github-local
      instanceId: github-trigger-1
      tokenFile: ./secrets/github-core.token
      threadIdPrefixes: ["github:", "https://github.com/"]
    - source: dws
      accountId: ACCOUNT_ID
      instanceId: dws-trigger-1
      tokenFile: ./secrets/dws-core.token
      threadIdPrefixes: ["dws:"]
      outboxConsumer: true

# Optional business checks alongside Core.
# watchdog:
#   interval: 10m

triggers:
  github:
    accountId: github-local
    instanceId: github-trigger-1
    coreTokenEnv: SUPERAGENT_GITHUB_CORE_TOKEN
    githubTokenEnv: SUPERAGENT_GITHUB_TOKEN
    # Use port 0 to let the OS choose a port.
    statusListen: 127.0.0.1:24372
    databasePath: ./trigger-state/github.sqlite
    # Optional. Omit to accept notifications from every repository accessible
    # to this GitHub account.
    repositories:
      - repository: example-org/example-repo
  dws:
    dwsExecutable: /absolute/path/to/dws
    profile: "CORP_ID:ACCOUNT_ID"
    source: dws
    accountId: ACCOUNT_ID
    selfOpenDingtalkId: ACCOUNT_OPEN_DINGTALK_ID
    instanceId: dws-trigger-1
    coreTokenEnv: SUPERAGENT_DWS_CORE_TOKEN
    statusListen: 127.0.0.1:24371
    databasePath: ./trigger-state/dws.sqlite
    direct:
      enabled: true
      match:
        - prefix: "Assistant "
